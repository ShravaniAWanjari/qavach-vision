# Qavach Safety Intelligence on one PC:   docker compose up -d     then open http://localhost:8830
# (clone the `qavach-safety-intelligence` branch). The first start builds the image, which downloads about 3 GB.
services:
  qavach:
    build: ./qavach-safety-intelligence
    image: qavach-safety-intelligence:local
    ports:
      - "127.0.0.1:8830:8830"          # this PC only; change the left-hand part if 8830 is taken
    volumes:
      - qavach-data:/data              # cameras, rules, uploaded videos and alert pictures survive restarts
    restart: unless-stopped

volumes:
  qavach-data:
